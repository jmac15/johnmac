<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom's Taxonomy Verb Generator</title>
<style>
body{font-family:Segoe UI,Aptos,Arial,sans-serif;margin:0;background:#f8fafc;color:#1e293b}
.container{max-width:1100px;margin:auto;padding:24px}
h1{text-align:center;color:#005EB8}
.subtitle{text-align:center;color:#475569;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{border:2px solid #bfdbfe;background:#fff;border-radius:20px;padding:18px;cursor:pointer;transition:.2s}
.card:hover,.card:focus{border-color:#005EB8}
.card.selected{background:#005EB8;color:#fff}
.result{background:#fff;border-radius:24px;padding:32px;margin-top:30px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
button.generate{background:#005EB8;color:#fff;border:none;padding:14px 28px;border-radius:14px;font-size:1rem;cursor:pointer}
button.generate:hover{background:#003087}
#verb{font-size:3rem;font-weight:700;color:#003087;margin-top:20px}
:focus{outline:3px solid #93c5fd;outline-offset:2px}
</style>
</head>
<body>
<div class="container">
<h1>Bloom's Taxonomy Verb Generator</h1>
<p class="subtitle">Generate action verbs to support learning outcomes, assessment design and curriculum planning.</p>
<div id="levels" class="grid"></div>
<div class="result">
<p>Selected Level</p>
<h2 id="levelName">Remember</h2>
<button class="generate" onclick="generateVerb()">Generate Verb</button>
<div aria-live="polite">
<p>Your Bloom's verb</p>
<div id="verb">Define</div>
</div>
</div>
</div>
<script>
const levels={Remember:{description:'Recall facts and basic concepts',verbs:['Define','Duplicate','List','Memorise','Recall','Repeat','State','Identify','Name','Recognise','Retrieve','Label','Locate','Match','Outline','Quote','Reproduce','Select','Cite','Record','Underline','Tabulate','Enumerate']},Understand:{description:'Explain ideas or concepts',verbs:['Classify','Describe','Discuss','Explain','Identify','Locate','Recognise','Report','Select','Translate','Paraphrase','Summarise','Interpret','Compare','Contrast','Demonstrate','Illustrate','Extend','Infer','Predict','Associate','Distinguish','Estimate','Generalise','Give examples','Rewrite']},Apply:{description:'Use information in new situations',verbs:['Execute','Implement','Solve','Use','Demonstrate','Interpret','Operate','Schedule','Sketch','Apply','Calculate','Change','Choose','Classify','Complete','Compute','Construct','Discover','Dramatise','Employ','Illustrate','Manipulate','Modify','Practise','Relate','Show','Transfer','Translate','Utilise']},Analyse:{description:'Draw connections among ideas',verbs:['Differentiate','Organise','Relate','Compare','Contrast','Distinguish','Examine','Experiment','Question','Test','Analyse','Appraise','Breakdown','Calculate','Categorise','Correlate','Diagram','Deconstruct','Discriminate','Illustrate','Infer','Outline','Point out','Prioritise','Separate','Subdivide','Investigate','Attribute','Deduce']},Evaluate:{description:'Justify a stand or decision',verbs:['Appraise','Argue','Defend','Judge','Select','Support','Value','Critique','Weigh','Assess','Compare','Conclude','Contrast','Convince','Criticise','Decide','Discriminate','Explain','Interpret','Justify','Rate','Recommend','Reframe','Summarise','Verify','Prioritise','Score','Standardise','Test','Validate']},Create:{description:'Produce new or original work',verbs:['Design','Assemble','Construct','Conjecture','Develop','Formulate','Author','Investigate','Compose','Devise','Generate','Plan','Produce','Combine','Compile','Derive','Elaborate','Facilitate','Forecast','Hypothesise','Integrate','Invent','Modify','Originate','Propose','Rearrange','Reconstruct','Reorganise','Revise','Synthesise','Write']}};
let selected='Remember';
const container=document.getElementById('levels');
Object.entries(levels).forEach(([name,data])=>{const b=document.createElement('button');b.className='card'+(name==='Remember'?' selected':'');b.innerHTML=`<h3>${name}</h3><p>${data.description}</p>`;b.onclick=()=>{selected=name;document.getElementById('levelName').textContent=name;document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));b.classList.add('selected');};container.appendChild(b);});
function generateVerb(){const list=levels[selected].verbs;document.getElementById('verb').textContent=list[Math.floor(Math.random()*list.length)];}
</script>
</body>
</html>
